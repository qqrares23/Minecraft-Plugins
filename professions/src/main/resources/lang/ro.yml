# Cum câștigă XP fiecare profesie și bonusurile pe niveluri.
profession:
  woodcutting:
    how: "Taie bușteni."
    bonuses:
      - "Mai mulți bușteni per buștean pe măsură ce crești în nivel (până la trei)"
      - "Din copaci: crengi, puieți ai acelui copac, mere,"
      - "cuiburi de păsări, faguri, rareori mere de aur"
  mining:
    how: "Sparge piatră, deepslate și minereuri."
    bonuses:
      - "Descoperirile țin de locul unde minezi: cărbune și minereu brut,"
      - "redstone, lapis și diamante la adâncime, cuarț în Nether"
      - "Șansă de minereu dublu; impulsuri de Haste de la nivelul 25"
  digging:
    how: "Sapă pământ, nisip, pietriș, lut, zăpadă, noroi..."
    bonuses:
      - "Ce găsești ține de sol: cremene în pietriș, lut,"
      - "oase, pepite, cioburi de ceramică, rareori smaralde și diamante"
      - "Șansă de recoltă dublă"
  farming:
    how: "Recoltează culturi complet crescute."
    bonuses:
      - "Șansă de recoltă dublă"
      - "Recolte bogate, făină de oase, morcovi de aur din morcovi,"
      - "pepene strălucitor din pepeni, semințe rare"
      - "Replantare automată de la nivelul 20"
  foraging:
    how: "Rupe iarbă, flori, frunze, ciuperci, liane, fructe de pădure."
    bonuses:
      - "Mai mult din ce culegi: flori, fructe de pădure, ciuperci, liane"
      - "Frunze: bețe, puieți, mere. Iarbă: semințe"
      - "Rar: semințe de torchflower, pitcher pod, spore blossom"
  fishing:
    how: "Prinde orice cu undița."
    bonuses:
      - "Peștii mușcă mai repede (se cumulează cu Lure)"
      - "Șansă de a prinde pești în plus"
      - "Comori din apă: alge, cerneală, prismarin, cochilii de nautilus,"
      - "rareori cărți, bureți, heart of the sea, tridente"
  hunting:
    how: "Ucide creaturi."
    bonuses:
      - "Șansă de pradă dublă"
      - "Rareori capete de creaturi"
      - "Mai mult XP"
  husbandry:
    how: "Înmulțește și tunde animale."
    bonuses:
      - "Șansă de pui gemeni"
      - "Părinții se pot înmulți din nou mai repede"
      - "Lână în plus la tuns"
  smelting:
    how: "Scoate obiectele topite din cuptoare."
    bonuses:
      - "Șansă de produs în plus"
  enchanting:
    how: "Vrăjește obiecte la masa de vrăjit."
    bonuses:
      - "Șansă de a primi nivelurile înapoi"
  alchemy:
    how: "Prepară poțiuni."
    bonuses:
      - "Șansă de a păstra ingredientul"
  smithing:
    how: "Repară și combină la nicovală, îmbunătățește la masa de forjă, fabrică unelte, arme și armuri."
    bonuses:
      - "Reparațiile la nicovală refac mai multă durabilitate"
      - "(+0,5% pe nivel)"
