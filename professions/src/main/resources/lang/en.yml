# How each profession earns XP, and its level bonuses.
profession:
  woodcutting:
    how: "Chop logs."
    bonuses:
      - "More logs per log as you level up (up to three)"
      - "From trees: sticks, that tree's saplings, apples,"
      - "bird's nests, honeycomb, rarely golden apples"
  mining:
    how: "Break stone, deepslate and ores."
    bonuses:
      - "Finds depend on where you mine: coal and raw ore,"
      - "redstone, lapis and diamonds deep down, quartz in the Nether"
      - "Chance of double ore; Haste bursts from level 25"
  digging:
    how: "Dig dirt, sand, gravel, clay, snow, mud..."
    bonuses:
      - "What you find depends on the ground: flint in gravel, clay,"
      - "bones, nuggets, pottery sherds, rarely emeralds and diamonds"
      - "Chance of a double harvest"
  farming:
    how: "Harvest fully grown crops."
    bonuses:
      - "Chance of a double harvest"
      - "Bumper crops, bone meal, golden carrots from carrots,"
      - "glistering melons from melons, rare seeds"
      - "Auto-replant from level 20"
  foraging:
    how: "Pick grass, flowers, leaves, mushrooms, vines, berries."
    bonuses:
      - "More of what you pick: flowers, berries, mushrooms, vines"
      - "Leaves: sticks, saplings, apples. Grass: seeds"
      - "Rare: torchflower seeds, pitcher pods, spore blossoms"
  fishing:
    how: "Catch anything with a fishing rod."
    bonuses:
      - "Fish bite faster (stacks with Lure)"
      - "Chance to catch extra fish"
      - "Treasure from the water: kelp, ink, prismarine, nautilus shells,"
      - "rarely books, sponges, heart of the sea, tridents"
  hunting:
    how: "Kill mobs."
    bonuses:
      - "Chance of double loot"
      - "Rarely mob heads"
      - "More XP"
  husbandry:
    how: "Breed and shear animals."
    bonuses:
      - "Chance of twin babies"
      - "Parents can breed again sooner"
      - "Extra wool when shearing"
  smelting:
    how: "Take smelted items out of furnaces."
    bonuses:
      - "Chance of extra output"
  enchanting:
    how: "Enchant items at the enchanting table."
    bonuses:
      - "Chance to get your levels back"
  alchemy:
    how: "Brew potions."
    bonuses:
      - "Chance to keep the ingredient"
  smithing:
    how: "Repair and combine at the anvil, upgrade at the smithing table, craft tools, weapons and armor."
    bonuses:
      - "Anvil repairs restore more durability"
      - "(+0.5% per level)"
# What each perk does.
