# Professions messages (MiniMessage format: https://docs.advntr.dev/minimessage/format.html).
# Placeholders in <angle brackets> are filled in by the plugin.
no-permission: "<red>You don't have permission."
xp-max: "<gray>  (max)"
perk-locked: "<red>Unlocks at level <level>."
perk-chosen: "<gray>Perk chosen: <perk>"
enchanting-refund: "<light_purple>✨ Enchanting: your <levels> levels were refunded!"
level-up:
  subtitle: "<yellow>reached level <level>"
  subtitle-max: "<yellow>reached level <level> (max)"
  chat: "<gold>⬆ <profession><gray> is now level <level>."
  new-perk: "<light_purple>  ✦ New perk to choose: type /professions and open <profession>."
find:
  rare: "<gold>✦ Rare find: <item>"
  very-rare: "<light_purple><bold>✦✦ Very rare find: </bold><item>"
smithing:
  refund: "<gray>⚒ Smithing: you got your <item> back!"
  masterwork-name: "<gold>✦ Masterwork <item>"
  masterwork: "<gold>⚒ Masterwork! <item>"
perk-message:
  bonus-rune: "<light_purple>✨ Bonus Rune: +1 enchantment level!"
  treasure-scholar: "<light_purple>✨ Treasure Scholar: an extra enchantment!"
unit:
  perk:
    one: "1 perk to choose"
    other: "<n> perks to choose"
menu:
  title: "<dark_green><bold>⚒ Professions"
  back: "<yellow>← Back"
  about:
    name: "<gold>About professions"
    lore:
      - "<gray>You have every profession at once."
      - "<gray>Level them up by working:"
      - "<gray>better yields and rare finds."
      - "<light_purple>At levels 10, 20, 30, 40 and 50 you pick a perk."
      - "<green>Click a profession to choose your perks."
      - "<dark_gray>Blocks placed by players give no XP."
  perks:
    name: "<light_purple><bold>Perks"
    lore:
      - "<gray>At every tier you pick one of two"
      - "<gray>(top or bottom). You can change them any time."
  tier: "<dark_gray>Level <level>"
  tier-reached: "<green>Level <level>"
  perk-locked: "<red>✖ Unlocks at level <level>"
  perk-chosen: "<green><bold>✔ CHOSEN"
  perk-pick: "<yellow>Click to choose it"
  level: "<dark_gray>Level: <yellow><level> / <max>"
  max-level: "<gold>Max level!"
  bonuses: "<gold>Bonuses:"
  open-perks: "<light_purple>✦ <count>"
  inactive: "<red>Not active for you here."
