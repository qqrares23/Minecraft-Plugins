# WeaponSkills - press the swap-hands key (F) with a weapon or tool to use a skill.
# In-game: /skills admin config set <key> <value>, /skills admin toggle <feature>, /skills admin reload.

# Language of player messages: en, ro, or any lang/<code>.yml you add. Change live: /skills admin lang <code>
language: en

# Worlds where skills and the dodge roll work.
# mode: blacklist = every world except the list; whitelist = only the listed worlds.
worlds:
  mode: blacklist
  list: []
# What you are doing when you press it picks the skill:
#   standing / mid-air / sprinting / sneaking, or blocking with a shield for Shield Bash.

# Hit passive mobs (cows, villagers...) with area skills. Hostile mobs, players (if PvP
# is on) and anything attacking you are always hit. Your own pets are never hit.
hit-passive-mobs: true

# Durability each skill use costs, and the chance it costs anything at all
# (1 and 0.5 = on average half a point of durability per use). Unbreaking still applies.
durability-cost: 1
durability-chance: 0.5

# Dodge roll: double-tap sneak while holding a combat weapon (not a pickaxe) or a shield.
dodge:
  enabled: true
  cooldown: 3              # seconds
  speed: 1.0               # how far the roll carries you
  untouchable-ticks: 10    # invulnerability frames: nothing hurts you for this long (20 ticks = 1 second)
  double-tap-millis: 300   # the two sneak presses must be this close together

# Sword and axe mastery makes normal attacks faster (a shorter cooldown between full hits).
attack-speed:
  per-mastery: 0.002       # +0.2% attack speed per mastery point...
  max-bonus: 0.30          # ...up to +30% (reached at 150 mastery)

# Per-skill settings: cooldown in seconds, damage as described per weapon.
