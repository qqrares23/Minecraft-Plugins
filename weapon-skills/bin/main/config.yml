# Skills level up as you use them (per player, per skill).
progression:
  max-level: 50
  # Cooldown reduction and effect length stop growing at this level (damage keeps growing to max-level).
  bonus-cap-level: 20
  xp-per-use: 5
  xp-per-hit: 1                   # per enemy hit...
  max-hit-xp-per-use: 5           # ...up to this much per use
  xp-per-level: 15                # level N -> N+1 needs 15 x N XP
  # Skill damage multiplier by skill level: from damage-at-level-1 up to damage-at-max-level, slowly at
  # first and faster near the top (damage-curve: 1 = straight line, higher = more back-loaded).
  # Defaults: x0.60 at 1, x0.71 at 10, x0.93 at 20, x1.21 at 30, x1.59 at 40, x1.95 at 50.
  damage-at-level-1: 0.6
  damage-at-max-level: 1.95
  damage-curve: 1.5
  cooldown-reduction-per-level: 0.015  # -1.5% cooldown per level above 1
  evolve-level: 10                # skills gain a new effect (evolve) at this level

# Cross-weapon combos: a skill hit marks the target; another weapon's skill hit triggers a combo.
combos:
  enabled: true

# Augments: at skill levels 30, 40 and 50 players pick one of two augments per skill.
augments:
  enabled: true

# Each weapon's skills on/off. A weapon can also be limited with the permission
# weaponskills.weapon.<id>, and a single skill with weaponskills.skill.<id> or skills.<id>.enabled
# (add "enabled: false" to that skill's entry above). Everyone has the permissions by default.
weapons:
  sword:
    enabled: true
  axe:
    enabled: true
  shield:
    enabled: true
  bow:
    enabled: true
  crossbow:
    enabled: true
  trident:
    enabled: true
  mace:
    enabled: true
  spear:
    enabled: true
  pickaxe:
    enabled: true
  woodcutting:
    enabled: true
  hoe:
    enabled: true
  shovel:
    enabled: true
  fishing_rod:
    enabled: true
