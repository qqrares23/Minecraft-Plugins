  ready: "<green>✔ Gata"
  combo-explain:
    - "<dark_gray>Abilitățile acestei arme îl lasă pe țintă 4 secunde."
    - "<dark_gray>Lovește ținta cu abilitatea altei arme:"
  equip-help:
    name: "<gold>Echiparea abilităților"
    lore:
      - "<gray>1. Dă click pe o abilitate de jos ca să o selectezi."
      - "<gray>2. Dă click pe un slot de sus ca să o pui acolo."
      - "<dark_gray>Abilitățile aeriene intră doar în slotul aerian,"
      - "<dark_gray>iar ultimatele doar în slotul de ultimată."
      - "<gray>Crește abilitățile în nivel ca să câștigi mastery și să deblochezi altele."
      - "<gold>Click dreapta pe o abilitate: augmentări (nivel 30, 40, 50)."
  augment-help:
    name: "<gold>Augmentări"
    lore:
      - "<gray>La nivelurile 30, 40 și 50 abilitatea primește"
      - "<gray>câte o augmentare: alegi una din două."
      - "<dark_gray>Poți schimba alegerea oricând, gratuit."
  help:
    name: "<gold>Cum folosești abilitățile"
    lore:
      - "<gray>Ține o armă în mână și apasă F (tasta de schimbat mâinile)."
      - "<gray>Ce faci în acel moment alege slotul abilității:"
      - "<aqua> stând pe loc, în aer, în sprint, furișat,"
      - "<aqua> privind în sus sau în jos."
      - "<light_purple>Furișat + privit în sus + F: ultimata ta."
      - "<gray>Blochezi cu scutul + F: abilitățile de scut."
      - "<dark_gray>Arcurile și arbaletele consumă o săgeată pe abilitate."
      - "<dark_gray>Săpăliga, lopata și undița au și ele câte o abilitate."
  summary:
    name: "<gold><player> - abilități"
    total: "<yellow>Nivel total al abilităților: <total> / <max>"
    lore:
      - "<gray>Folosește abilitățile ca să le crești nivelul:"
      - "<gray>mai multe daune, reîncărcări mai scurte"
      - "<gray>și abilități noi de deblocat."
# Cartea /guide. Fiecare element din listă e o pagină; <max-level> și <evolve> se completează.
guide:
  title: "Ghidul aventurierului"
  author: "Server"
  contents-title: "<dark_red><bold>Ghidul aventurierului</bold></dark_red>"
  turn-page: "<dark_gray>Dă pagina!"
  contents:
    skills: "Abilități de armă"
    levels: "Niveluri și deblocări"
    all-skills: "Toate abilitățile"
    paths: "Paths"
    professions: "Profesii"
    enchants: "Vrăji"
    mobs: "Creaturi puternice"
    commands: "Comenzi"
  intro:
    - "<dark_red><bold>Abilități de armă</bold></dark_red>\n\nȚine o armă și apasă F.\n<dark_gray>Ce faci atunci alege abilitatea:</dark_gray>\n- stând pe loc\n- în aer (săritură)\n- în sprint\n- furișat\n- privind în sus / jos\n<dark_purple>Furișat + privit în sus: ultimata"
    - "<dark_red><bold>Abilități de armă</bold></dark_red>\n\nSăbii, topoare, arcuri, arbalete, tridente, buzdugane, sulițe, târnăcoape, săpăligi, lopeți și undițe au abilități. Toporul: tăiat lemne când privești un copac.\n\nScut: blochezi + F.\nBlocat + furișat + F: a doua abilitate de scut.\n\n<dark_gray>Arcurile consumă 1 săgeată pe abilitate."
    - "<dark_red><bold>Eschivă și combo</bold></dark_red>\n\nEschivă: apasă rapid de două ori pe furișat, cu o armă în mână. Atacurile nu te ating o clipă.\n\nCombo: loviturile una după alta fac tot mai multe daune. A 10-a e lovitura finală!"
    - "<dark_red><bold>Niveluri și deblocări</bold></dark_red>\n\nAbilitățile cresc de la nivelul 1 la <max-level> când le folosești.\n\nDaunele cresc până la nivelul <max-level> - încet la început, mai repede spre final. Până la nivelul 20: și reîncărcare mai scurtă.\n\n<dark_purple>Nivelul <evolve>: abilitatea EVOLUEAZĂ!"
    - "<dark_red><bold>Mastery</bold></dark_red>\n\nFiecare nivel de abilitate peste 1 = 1 punct de mastery pentru armă.\n\nMastery deblochează abilități noi și ultimate (la 25: sabie, topor, arc, arbaletă, trident, buzdugan, suliță).\n\n<dark_gray>Sabie și topor: mai multă mastery = atac mai rapid."
    - "<dark_red><bold>Augmentări</bold></dark_red>\n\nLa nivelurile 30, 40 și 50 alegi o augmentare pentru abilitate: click dreapta pe ea în /skills.\n\nCombo între arme: lovește o țintă marcată de abilitatea unei arme cu abilitatea altei arme."
  unlock: "Deblocare: mastery <weapon> <mastery>"
  ultimate: " - ULTIMATĂ"
  skill-page: "<dark_red><bold><skill></bold></dark_red>\n<dark_gray><weapon><ultimate></dark_gray>\n<dark_blue><how></dark_blue>\n\n<description>\n\n<dark_purple>Lvl <evolve>: <evolution>"
  # Apar doar dacă pluginul respectiv e instalat.
  sections:
    paths:
      - "<dark_red><bold>Paths</bold></dark_red>\n\nScrie /paths și alege 2: Duelist, Warbringer, Ranger, Arbalist, Tidecaller, Juggernaut, Sentinel, Shadow, Beastmaster, Pyromancer, Frost Warden, Lancer.\n\n<dark_gray>Alegi singur pasivele și abilitatea (M2)."
      - "<dark_red><bold>Paths</bold></dark_red>\n\nPaths cresc de la nivelul 1 la 50 din lovituri și ucideri cu arma lor.\n\nLa nivelurile 5, 10, 15, 20, 30, 40 și 50 alegi câte un talent.\n\n<dark_gray>Toiagul (Blaze/Breeze Rod) al magilor: click stânga = bolt.\n\n<dark_gray>Renunțarea la un path: o pauză până poți renunța din nou; progresul rămâne."
    professions:
      - "<dark_red><bold>Profesii</bold></dark_red>\n\nScrie /professions. Le ai pe toate și le crești muncind:\ntăiat lemne, minerit, săpat, agricultură, cules, pescuit, vânătoare, creșterea animalelor, topit, vrăjit, alchimie, fierărie."
      - "<dark_red><bold>Profesii</bold></dark_red>\n\nNiveluri mai mari: descoperiri rare, recolte duble, pescuit mai rapid și altele. Avantaje la nivelurile 10, 20, 30, 40 și 50.\n\n<dark_gray>Blocurile puse de jucători nu dau XP."
    enchants:
      - "<dark_red><bold>Vrăji</bold></dark_red>\n\n52 de vrăji magice pentru arme, armuri, elytre, arcuri, tridente, buzdugane, scuturi și unelte.\n\nLe obții de la masa de vrăjit, din pradă și de la bibliotecari.\n\n<dark_gray>Scrie /enchants și alege o categorie."
    mobs:
      - "<dark_red><bold>Creaturi puternice</bold></dark_red>\n\nUnele creaturi ostile apar cu abilități speciale.\n\nAu mai multă viață, dau XP x3 și uneori pradă rară.\n\n<dark_gray>Ai grijă la călăreți, la brutele în armură și la Luna Sângerie!"
  commands:
    title: "<dark_red><bold>Comenzi</bold></dark_red>"
    always:
      - "/guide - această carte"
      - "/skills - abilități și sloturi"
    paths:
      - "/paths - paths-urile tale"
    professions:
      - "/professions"
    enchants:
      - "/enchants - lista de vrăji"
    mobs: []
    extra:
      - "<dark_gray>/home /tpa /warp /spawn"
