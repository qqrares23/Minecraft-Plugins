    name: "<gold>Augments"
    lore:
      - "<gray>At levels 30, 40 and 50 the skill gets"
      - "<gray>an augment: pick one of two."
      - "<dark_gray>You can change your choice any time, for free."
  help:
    name: "<gold>How to use skills"
    lore:
      - "<gray>Hold a weapon and press F (the swap-hands key)."
      - "<gray>What you're doing at that moment picks the slot:"
      - "<aqua> standing, in the air, sprinting, sneaking,"
      - "<aqua> looking up or down."
      - "<light_purple>Sneak + look up + F: your ultimate."
      - "<gray>Block with a shield + F: shield skills."
      - "<dark_gray>Bows and crossbows use an arrow per skill."
      - "<dark_gray>Hoes, shovels and fishing rods have a skill too."
  summary:
    name: "<gold><player> - skills"
    total: "<yellow>Total skill level: <total> / <max>"
    lore:
      - "<gray>Use skills to level them up:"
      - "<gray>more damage, shorter cooldowns"
      - "<gray>and new skills to unlock."
# The /guide book. Each list entry is one page; <max-level> and <evolve> are filled in.
guide:
  title: "Adventurer's Guide"
  author: "Server"
  contents-title: "<dark_red><bold>Adventurer's Guide</bold></dark_red>"
  turn-page: "<dark_gray>Turn the page!"
  contents:
    skills: "Weapon skills"
    levels: "Levels and unlocks"
    all-skills: "Every skill"
    paths: "Paths"
    professions: "Professions"
    enchants: "Enchantments"
    mobs: "Mighty mobs"
    commands: "Commands"
  intro:
    - "<dark_red><bold>Weapon skills</bold></dark_red>\n\nHold a weapon and press F.\n<dark_gray>What you're doing picks the skill:</dark_gray>\n- standing still\n- in the air (jump)\n- sprinting\n- sneaking\n- looking up / down\n<dark_purple>Sneak + look up: ultimate"
    - "<dark_red><bold>Weapon skills</bold></dark_red>\n\nSwords, axes, bows, crossbows, tridents, maces, spears, pickaxes, hoes, shovels and fishing rods have skills. Axe: woodcutting when you look at a tree.\n\nShield: block + F.\nBlock + sneak + F: the second shield skill.\n\n<dark_gray>Bows use 1 arrow per skill."
    - "<dark_red><bold>Dodge and combo</bold></dark_red>\n\nDodge: double-tap sneak with a weapon in hand. Attacks can't touch you for a moment.\n\nCombo: hits in a row deal more and more damage. The 10th is the finisher!"
    - "<dark_red><bold>Levels and unlocks</bold></dark_red>\n\nSkills grow from level 1 to <max-level> as you use them.\n\nDamage grows all the way to level <max-level> - slowly at first, faster near the top. Up to level 20: shorter cooldown too.\n\n<dark_purple>Level <evolve>: the skill EVOLVES!"
    - "<dark_red><bold>Mastery</bold></dark_red>\n\nEvery skill level above 1 = 1 mastery point for the weapon.\n\nMastery unlocks new skills and ultimates (at 25: sword, axe, bow, crossbow, trident, mace, spear).\n\n<dark_gray>Sword and axe: more mastery = faster attacks."
    - "<dark_red><bold>Augments</bold></dark_red>\n\nAt skill levels 30, 40 and 50 you pick an augment for that skill: right-click it in /skills.\n\nCross-weapon combos: hit a target marked by one weapon's skill with another weapon's skill."
  unlock: "Unlock: <weapon> mastery <mastery>"
  ultimate: " - ULTIMATE"
  skill-page: "<dark_red><bold><skill></bold></dark_red>\n<dark_gray><weapon><ultimate></dark_gray>\n<dark_blue><how></dark_blue>\n\n<description>\n\n<dark_purple>Lvl <evolve>: <evolution>"
  # Only shown when that plugin is installed.
  sections:
    paths:
      - "<dark_red><bold>Paths</bold></dark_red>\n\nType /paths and pick 2: Duelist, Warbringer, Ranger, Arbalist, Tidecaller, Juggernaut, Sentinel, Shadow, Beastmaster, Pyromancer, Frost Warden, Lancer.\n\n<dark_gray>You choose the passives and the skill (M2) yourself."
      - "<dark_red><bold>Paths</bold></dark_red>\n\nPaths grow from level 1 to 50 from hits and kills with their weapon.\n\nAt levels 5, 10, 15, 20, 30, 40 and 50 you pick a talent.\n\n<dark_gray>Mages' staff (Blaze/Breeze Rod): left-click = bolt.\n\n<dark_gray>Dropping a path: a pause before you can drop another; progress stays."
    professions:
      - "<dark_red><bold>Professions</bold></dark_red>\n\nType /professions. You have all of them and level them by working:\nwoodcutting, mining, digging, farming, foraging, fishing, hunting, husbandry, smelting, enchanting, alchemy, smithing."
      - "<dark_red><bold>Professions</bold></dark_red>\n\nHigher levels: rare finds, double harvests, faster fishing and more. Perks at levels 10, 20, 30, 40 and 50.\n\n<dark_gray>Blocks placed by players give no XP."
    enchants:
      - "<dark_red><bold>Enchantments</bold></dark_red>\n\n52 magic enchantments for weapons, armor, elytra, bows, tridents, maces, shields and tools.\n\nGet them from the enchanting table, loot and librarians.\n\n<dark_gray>Type /enchants and pick a category."
    mobs:
      - "<dark_red><bold>Mighty mobs</bold></dark_red>\n\nSome hostile mobs spawn with special abilities.\n\nThey have more health, give x3 XP and sometimes rare loot.\n\n<dark_gray>Watch out for riders, armored brutes and the Blood Moon!"
  commands:
    title: "<dark_red><bold>Commands</bold></dark_red>"
    always:
      - "/guide - this book"
      - "/skills - skills and slots"
    paths:
      - "/paths - your paths"
    professions:
      - "/professions"
    enchants:
      - "/enchants - enchantment list"
    mobs: []
    extra:
      - "<dark_gray>/sidebar /stats"
# How each trigger slot is used.
trigger:
  standing: "F"
  airborne: "F in the air"
  sprinting: "F while sprinting"
  sneaking: "F while sneaking"
  looking_up: "F looking up"
  looking_down: "F looking down"
  ultimate: "F sneaking and looking up"
  blocking: "F while blocking"
  blocking_sneaking: "F blocking and sneaking"
# What each augment does.
augment:
  brutal: "+25% damage, but a 15% longer cooldown."
  swift: "20% shorter cooldown (10% less damage)."
  execute: "+40% damage to enemies below 30% health."
  searing: "The hit sets the target on fire for 3 seconds."
  frost: "The hit slows the target (Slowness II, 2 seconds)."
  venom: "The hit poisons the target for 3 seconds."
  sunder: "The hit weakens the target (Weakness, 4 seconds)."
  vampiric: "You heal for 6% of the damage dealt."
  reaping: "A kill with the skill cuts the remaining cooldown by 30%."
  echo: "20% chance that the skill doesn't go on cooldown."
  guarded: "After use: Resistance I for 4 seconds."
  fleet: "After use: Speed II for 4 seconds."
  mending: "After use: you heal 3 hearts."
  vigor: "After use: Strength I for 5 seconds."
# Cross-weapon combo effects.
combo:
  exposed: "Combo: +50% of the hit as bonus damage."
  sundered: "Combo: the target's armor drops by 6 for 5 seconds, +25% damage."
  staggered: "Combo: the target is dazed for 1.5 seconds and knocked back."
  marked: "Combo: +35% bonus damage and the target glows for 5 seconds."
  bolted: "Combo: a small explosion (no blocks) hurts everything around the target."
  soaked: "Combo: lightning strikes the target for +60% damage."
  dazed: "Combo: the target is dazed for 2 seconds."
  pinned: "Combo: the target is pinned for 1.5 seconds, +25% damage."
# What each skill does.
skill:
  whirlwind: "Spin in place and hit everything around you."
  ground_slam: "Dive down and send out a shockwave. The higher you fall from, the harder you hit."
  dash_strike: "Dash forward and slash everything in your way."
  parry: "A short guard stance: block the next hit and strike back."
  rising_slash: "An upward slash that launches the enemies in front of you."
  blade_flurry: "Six quick slashes into everything in front of you."
  shadow_step: "Teleport behind the enemy you're looking at and strike it, blinding it."
  blade_dance: "For 6 seconds: much faster attacks and a little extra speed."
  mirror_image: "Create two copies of yourself that draw enemies, and vanish for a moment."
  crescent_wave: "Send a blade wave forward that pierces everything it meets."
  counter_stance: "For 2 seconds you take half damage, then release it all in one strike."
  thousand_cuts: "Twelve lightning-fast cuts into the enemy you're looking at."
  judgment: "ULTIMATE: a storm of blades falls from the sky around you."
  cleave: "A heavy blow in front of you that also disables shields."
  executioners_drop: "Dive onto enemies: big damage and a daze."
  berserker_charge: "Charge forward pushing enemies aside, then get Strength and Speed."
  axe_throw: "Throw a spinning axe that hits the first enemy and comes back."
  war_cry: "A mighty roar: nearby enemies are weakened and slowed, and you get Resistance."
  earthsplitter: "Split the ground in a straight line, launching and dazing enemies."
  bloodlust: "For 8 seconds: every kill heals you and your hits get stronger."
  ground_pound: "Pound the ground: hurt and heavily slow everything around you."
  chain_hook: "Hook the enemy you're looking at and pull it to you."
  tomahawk_rain: "A rain of axes falls where you're looking."
  lumberjacks_fury: "Your next 5 axe hits (within 10s) also hit the enemies around the target."
  bone_breaker: "A bone-breaking blow: the target can barely move and can't jump for 5 seconds."
  ragnarok: "ULTIMATE: become a giant for 10 seconds, with huge damage and resistance."
  shield_bash: "Bash forward with your shield: knockback, daze, and enemy shields disabled."
  fortify: "Brace for impact: Resistance II for a few seconds."
  reflect: "For 4 seconds, arrows and projectiles that hit you fly back at the shooter."
  guardian_aura: "For 8 seconds, you and nearby players take 30% less damage."
  taunt: "Force nearby mobs to attack you and get Resistance."
  shield_throw: "Throw your shield: it bounces between enemies (3 targets), then comes back."
  phalanx: "For 6 seconds, players around you get Resistance II and you get Resistance I."
  arrow_rain: "A rain of arrows falls where you aim."
  piercing_shot: "A powerful arrow that goes through several enemies."
  volley: "Shoot five arrows in a fan."
  wind_arrow: "An arrow carrying a gust of wind: it bursts where it lands and throws enemies back and up. Close to the burst, it throws you too (no fall damage)."
  hover_shot: "Hang in the air for a moment and shoot three arrows."
  rain_of_fire: "A rain of flaming arrows falls where you aim."
  trap_arrow: "The arrow leaves a trap where it lands: the first enemy to step in is rooted for 4 seconds."
  split_shot: "An arrow that splits into five arrows in flight."
  sniper_mode: "Aim for a moment (zoom), then shoot a very heavy, very fast arrow."
  storm_of_arrows: "ULTIMATE: for 5 seconds, arrows rain down on every enemy around you."
  explosive_bolt: "An arrow that explodes on impact (never breaks blocks)."
  net_shot: "An arrow that bursts into a net and roots everything nearby."
  harpoon_bolt: "An arrow that pulls what it hits towards you."
  burst_fire: "Shoot three arrows in quick succession."
  recoil_shot: "Shoot straight ahead and get thrown back by the recoil."
  gatling: "Shoot ten arrows in very quick succession."
  smoke_bolt: "An arrow that makes a smoke cloud: enemies in it are blinded, slowed and lose track of you."
  chain_bolt: "The target is chained to two nearby enemies: they're pulled towards each other for 4 seconds."
  artillery_barrage: "ULTIMATE: twelve shells explode in the area you're looking at (they don't break blocks)."
  riptide_surge: "Launch forward like Riptide, even without rain."
  tidal_wave: "Send a wave of water forward that hurts and pushes enemies."
  lightning_call: "Call lightning down on the enemy you're looking at."
  poseidons_call: "Call a wave that carries you forward, slamming enemies in the way."
  harpoon_throw: "Throw a harpoon that hits the first enemy and drags it back to you."
  tsunami: "ULTIMATE: three huge waves sweep everything in front of you."
  gravity_well: "Pull every nearby enemy towards you."
  tremor: "Shake the ground: hurt and daze everything around you."
  meteor: "Crash down like a meteor. Much stronger the higher you fall from."
  wind_burst: "A gust throws you straight up and pushes away those around you. Perfect for a falling mace hit."
  anvil_drop: "An anvil falls from the sky onto the enemy you're looking at and dazes it."
  cataclysm: "ULTIMATE: leap up and crash down with three ever-wider shockwaves."
  impale: "A long thrust (6 blocks) that pierces everything in a line in front of you. The first target is pinned for a second."
  dragoon_dive: "Dive spear-first towards the spot in front of you. The higher you fall from, the harder you hit."
  lance_charge: "Charge spear-first: the first enemy is rammed, thrown forward and takes heavy damage."
  javelin: "Throw a spear that flies far and pierces up to three enemies."
  pole_vault: "Vault on your spear: jump forward and up, then float down gently."
  sweeping_arc: "Swing the spear in a circle: hurt and push everything within 4.5 blocks."
  spear_wall: "Brace your spear for 4 seconds: enemies approaching from the front are stabbed and pushed back. You get Resistance."
  thrust_flurry: "Eight quick thrusts in a line (5 blocks), each piercing every enemy in the way."
  pinning_throw: "Throw the spear at the enemy you're looking at: it's pinned to the ground for 3 seconds and glows."
  dragon_leap: "Leap to the spot you aim at (16 blocks) and land spear-first, launching nearby enemies."
  gungnir: "ULTIMATE: a giant spear falls from the sky in front of you, then spikes of light burst from the ground in ever-wider rings."
  tremor_sense: "Reveals nearby ores through walls for 10 seconds (only you can see them)."
  tunnel_bore: "Dig a 3x3 tunnel, three blocks deep, in the direction you're looking."
  miners_rush: "Mine much faster for 10 seconds."
  shatter: "Shatter the rock around the block you're looking at."
  clear_cut: "Fell every tree in a 10x10 area around you and replant the saplings."
  grove_growth: "Every sapling around you (8 blocks) grows into a tree on the spot."
  lumber_frenzy: "20 seconds: every log you chop gives an extra one and you chop faster (Haste II)."
  harvest_wave: "Harvest and replant every ripe crop in a 5x5 area."
  burrow: "For 5 seconds you instantly break dirt, sand, gravel and other soft blocks."
  grapple_hook: "Hook the block you're looking at (up to 30 blocks) and get pulled to it."
# What each skill gains when it evolves.
evolution:
  whirlwind: "Wider spin (5 blocks) and a second spin half a second later."
  ground_slam: "Bigger shockwave that also dazes."
  dash_strike: "Longer dash that launches enemies into the air."
  parry: "Longer guard, and the riposte hits everything around you."
  rising_slash: "Launches the enemies around you higher."
  blade_flurry: "The slashes surround you and hit to the sides and behind too (bigger radius)."
  shadow_step: "A shadow burst hits and blinds everything near the target."
  blade_dance: "Lasts 50% longer and adds Strength."
  mirror_image: "Three decoys that explode when they vanish."
  judgment: "More blades over a much wider area."
  crescent_wave: "Three waves in a fan."
  counter_stance: "You take 70% less damage, and the counter hits all around you."
  thousand_cuts: "Twenty cuts, and the last one hits triple."
  cleave: "A full-circle blow that hits all around."
  executioners_drop: "Bigger impact and a longer daze."
  berserker_charge: "Longer charge and Strength II afterwards."
  axe_throw: "Throw three axes in a fan."
  war_cry: "Also heals nearby players and gives them Strength."
  earthsplitter: "Three cracks: one forward and one to each side."
  bloodlust: "Kills heal double and give a burst of Speed."
  ground_pound: "Bigger area and stronger slow."
  chain_hook: "Two more chains hook the nearest enemies in front of you."
  ragnarok: "Lasts 15 seconds, with a burning aura around you."
  impale: "9 block thrust, and every target is pinned."
  dragoon_dive: "Wider impact, and the enemies hit are pinned."
  lance_charge: "Longer charge that doesn't stop: you ram everything in the way."
  javelin: "Pierces five enemies, and the last one is pinned for 2 seconds."
  pole_vault: "Jump further and get Speed II for 4 seconds."
  sweeping_arc: "6 block radius, and the enemies hit are slowed."
  spear_wall: "Lasts 6 seconds and stabs all around, not only in front."
  thrust_flurry: "Twelve thrusts."
  pinning_throw: "Enemies around the target (3 blocks) are pinned too."
  dragon_leap: "Wider impact that also dazes enemies."
  gungnir: "A fourth, wider ring of spikes."
  tomahawk_rain: "Eighteen axes over a wider area."
  lumberjacks_fury: "Eight hits, with a bigger radius, that also knock enemies back."
  bone_breaker: "The target is also weakened and glows through walls."
  shield_bash: "Hits a much wider arc and knocks enemies further."
  fortify: "Also gives Absorption."
  reflect: "Lasts longer, and reflected projectiles hit twice as hard."
  guardian_aura: "10 block radius and 40% less damage."
  taunt: "Taunted mobs are weakened."
  shield_throw: "Bounces between five enemies."
  phalanx: "10 block radius, lasts longer and gives Absorption."
  arrow_rain: "Almost twice as many arrows over a wider area."
  piercing_shot: "Shoots three piercing arrows."
  volley: "Nine arrows instead of five."
  wind_arrow: "A bigger, stronger burst; enemies caught in it also take damage."
  hover_shot: "Six arrows and a longer hover."
  rain_of_fire: "More arrows, and the ground burns for 3 more seconds."
  trap_arrow: "Bigger trap that catches every enemy in it."
  split_shot: "Splits into eight arrows."
  sniper_mode: "x1.5 damage and pierces five enemies."
  storm_of_arrows: "Lasts 8 seconds, with twice as many arrows."
  explosive_bolt: "Three more explosions around the first."
  net_shot: "A much bigger net."
  harpoon_bolt: "Also pulls everything next to the target."
  burst_fire: "Five arrows instead of three."
  recoil_shot: "Shoots three arrows."
  gatling: "Sixteen arrows."
  smoke_bolt: "Bigger cloud that lasts longer and weakens enemies."
  chain_bolt: "Chains four enemies, and the chains shock them every second."
  artillery_barrage: "Twenty shells over a wider area."
  riptide_surge: "Longer surge that launches enemies into the air."
  tidal_wave: "Twice as wide and reaches further."
  lightning_call: "Three more bolts strike nearby enemies."
  poseidons_call: "The wave carries you further, then you get Dolphin's Grace and Water Breathing."
  harpoon_throw: "Pierces and drags up to three enemies."
  tsunami: "Five wider waves that also weaken enemies."
  gravity_well: "Pulls from further away, then crushes everything it pulled."
  tremor: "A second tremor a moment later."
  meteor: "The crater keeps burning for 3 more seconds."
  wind_burst: "Throws you higher and pushes harder, over a bigger radius."
  anvil_drop: "Two more anvils fall around the target."
  cataclysm: "A fourth wave, and the waves pull enemies to the center."
  tremor_sense: "Bigger radius and lasts longer."
  tunnel_bore: "Digs five blocks deep instead of three."
  miners_rush: "Even faster, and lasts 50% longer."
  shatter: "A bigger blast."
  clear_cut: "A 16x16 area."
