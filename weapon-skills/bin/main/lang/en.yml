  longer-effect: "<dark_gray>Higher levels: <red>longer effect"
  cooldown: "<dark_gray>Cooldown: <white><seconds>s"
  evolved: "<light_purple>✔ Evolved:"
  evolves-at: "<dark_gray>✖ Evolves at level <level>:"
