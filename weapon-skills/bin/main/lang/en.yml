  augment-open: "<gold>◇ Level <level> augment to choose (right-click)"
  augment-at: "<dark_gray>◇ Augment at level <level>"
  ready-in: "<red>⌛ Ready in <seconds>s"
  ready: "<green>✔ Ready"
  combo-explain:
    - "<dark_gray>This weapon's skills leave it on the target for 4 seconds."
    - "<dark_gray>Hit the target with another weapon's skill:"
  equip-help:
    name: "<gold>Equipping skills"
    lore:
      - "<gray>1. Click a skill below to select it."
      - "<gray>2. Click a slot above to put it there."
      - "<dark_gray>Aerial skills only go in the mid-air slot,"
      - "<dark_gray>and ultimates only in the ultimate slot."
      - "<gray>Level skills up to earn mastery and unlock more."
      - "<gold>Right-click a skill: augments (level 30, 40, 50)."
