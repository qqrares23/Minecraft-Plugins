# The /enchants categories (their name and the lines under it).
category:
  melee:
    name: "Săbii, topoare și sulițe"
    lore:
      - "<gray>Lovituri, sângerare, fulgere, viață..."
  spear:
    name: "Sulițe"
    lore:
      - "<gray>Doar pentru sulițe."
  armor:
    name: "Armură și elytre"
    lore:
      - "<gray>Protecție, mișcare și zbor."
  ranged:
    name: "Arcuri și arbalete"
    lore:
      - "<gray>Săgeți care urmăresc, explodează, ricoșează..."
  trident:
    name: "Tridente"
    lore:
      - "<gray>Vârtejuri, furtuni și apă."
  mace:
    name: "Buzdugane"
    lore:
      - "<gray>Lovituri din cădere mai puternice."
  shield:
    name: "Scuturi"
    lore:
      - "<gray>Recompense pentru blocare."
  tools:
    name: "Unelte"
    lore:
      - "<gray>Târnăcoape, lopeți, sape și undițe."
  magic:
    name: "Magie"
    lore:
      - "<gray>Merg cu abilitățile, path-urile, profesiile,"
      - "<gray>combo-ul și Luna Sângerie."
  staff:
    name: "Toiege"
    lore:
      - "<gray>Pentru toiegele Pyromancer și Frost Warden"
      - "<gray>(Blaze Rod, Breeze Rod) - din cărți, la nicovală."
  mounts:
    name: "Cai și animale"
    lore:
      - "<gray>Armură de cal și de lup."
