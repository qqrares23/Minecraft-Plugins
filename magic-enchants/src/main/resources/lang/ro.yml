# What each enchantment does (shown in /enchants).
enchant:
  bleeding: "Șansă ca ținta să sângereze, ignorând armura."
  venom: "Șansă de a otrăvi ținta."
  frostbite: "Șansă de a încetini și îngheța ținta."
  lifesteal: "Te vindecă cu o parte din daunele pe care le faci."
  executioner: "Daune în plus împotriva țintelor sub 30% viață."
  thunderstrike: "Șansă de a lovi ținta cu un fulger."
  cleaving: "Loviturile tale rănesc și inamicii de lângă țintă."
  soul_harvest: "Uciderile dau mai mult XP și uneori un Soul Fragment (dă XP abilităților)."
  chain_lightning: "Șansă ca fulgerul să sară între inamicii apropiați."
  momentum: "Loviturile rapide, una după alta, fac tot mai multe daune."
  skill_surge: "Fiecare lovitură scurtează reîncărcarea abilităților de armă."
  pinning: "Loviturile încărcate pot țintui ținta în loc 1,5 secunde."
  skyfall: "Lovituri din cădere: +35% daune și ținta e trântită la pământ."
  vanguard: "Cu un scut în mâna stângă: lovituri mai puternice și mai puține daune primite."
  thorns_of_frost: "Șansă de a încetini și îngheța pe cine te lovește."
  second_wind: "Sub 20% viață: un val de Regenerare și Absorbție (reîncărcare 2 min)."
  evasion: "Șansă mică de a evita complet un atac."
  spring_heels: "Sărituri mai înalte și mai puține daune din cădere."
  night_vision: "Vezi în întuneric cât timp îl porți."
  homing: "Săgețile se curbează spre țintele apropiate."
  barrage: "Tragi săgeți în plus la fiecare tragere (doar arcuri)."
  explosive_tips: "Săgețile explodează la impact (nu sparg niciodată blocuri)."
  hunters_mark: "Țintele lovite strălucesc și primesc daune în plus o vreme."
  ricochet: "Săgețile sar la alt inamic apropiat după ce lovesc."
  harpoon: "Săgețile trag spre tine ce lovesc."
  scatter_shot: "Săgețile se sparg în schije la impact, rănind tot ce e în jur."
  auto_smelt: "Blocurile minate cad gata topite: lingouri în loc de minereu brut, piatră, sticlă..."
  magnet: "Ce minezi ajunge direct în inventar."
  excavator: "Minezi 3x3 dintr-odată cu târnăcoape și lopeți (furișat ca să minezi un singur bloc)."
  treasure_hunter: "Șansă ca o captură să fie o comoară: cărți vrăjite, șei, arcuri și undițe vrăjite..."
  snagging: "Când tragi undița, creatura agățată e smulsă puternic spre tine."
  replenish: "Culturile coapte recoltate cu sapa se replantează singure (folosesc o sămânță din recoltă)."
  green_thumb: "Cât ții sapa în mână, culturile din jurul tău cresc mai repede."
  tailwind: "Un impuls de viteză când începi să planezi (reîncărcare 5 s)."
  cushion: "Mai puține daune când te izbești de un perete în zbor."
  maelstrom: "Tridentul aruncat lasă un vârtej care trage inamicii spre el."
  stormcaller: "Pe ploaie, tridentul aruncat cheamă un fulger asupra țintei (fără furtună)."
  undertow: "Daune în plus împotriva țintelor ude: în apă sau în ploaie."
  aftershock: "Loviturile din cădere lasă o a doua undă de șoc o secundă mai târziu."
  gravity_well: "Loviturile din cădere trag inamicii din jur spre locul impactului."
  featherfall: "Cu buzduganul în mână: jumătate din daunele de cădere, deloc dacă ai lovit (sau ai ratat) chiar înainte de aterizare."
  bastion: "Un atac blocat îți dă Absorbție câteva secunde (reîncărcare 10 s)."
  spiked: "Cine te lovește în scut se rănește în țepi."
  reflection: "Șansă ca o săgeată blocată să zboare înapoi spre cel care a tras-o."
  arcane_echo: "Șansă ca o abilitate de armă (WeaponSkills) să nu intre în reîncărcare."
  cooldown_siphon: "Fiecare ucidere scurtează reîncărcarea abilităților de armă."
  pathbound: "Mai mult XP pentru path-ul care folosește arma asta."
  scholar: "Mai mult XP pentru profesia în care folosești unealta."
  mightslayer: "Daune în plus împotriva creaturilor puternice și a aparițiilor speciale."
  blood_moons_gift: "În nopțile cu Lună Sângerie: daune în plus, iar uciderile te vindecă."
  combo_keeper: "Combo-ul ține mai mult între lovituri."
  soulbound: "Obiectul rămâne la tine când mori. Comoară: doar din pradă și de la bibliotecari."
  packleader: "Lupul care poartă armura face mai multe daune și se vindecă atunci când ucide."
  timbersong: "Abilitățile de tăiat lemne se reîncarcă mai repede, iar buștenii dau mai mult XP de Woodcutting."
  prospector: "Mai multe descoperiri de Mining din minereuri (Professions)."
  bounty_hunter: "Creaturile puternice și aparițiile speciale ucise cu arma au șanse mai mari de pradă rară."
  warding: "Mai puține daune din abilități, path-uri și efecte de vrăji."
  steadfast: "Mai puțin recul, iar imobilizările țin mai puțin."
  last_stand: "O dată la 3 minute, o lovitură mortală te lasă la o inimă. Comoară."
  fleetfoot: "Eschiva se reîncarcă mai repede."
  sure_footed: "Nisipul sufletelor și blocurile de miere nu te mai încetinesc."
  clarity: "Orbirea, Întunericul și Greața țin mai puțin."
  headhunters_eye: "Vezi în sidebar viața jucătorului sau a creaturii la care te uiți."
  vigor: "+1 inimă maximă pe nivel."
  piercing_bolt: "Săgețile de arbaletă trec prin armură: daune mai mari cu cât ținta poartă mai multă armură."
  overcharge: "O săgeată ținută încărcată cel puțin 3 secunde face mai multe daune."
  impalers_reach: "Ajungi mai departe cu sulița."
  rally: "Loviturile încărcate dau Viteză jucătorilor din jur (reîncărcare 8 s)."
  shockwave: "Loviturile din cădere dezactivează 3 secunde scuturile inamicilor din jurul impactului."
  spellweaver: "Bolturile toiagului pleacă mai des."
  battle_focus: "Abilitatea M2 și vraja path-ului se reîncarcă mai repede."
  wildfire: "O creatură care arde, ucisă de bolturile tale, izbucnește în flăcări care aprind inamicii din jur."
  inferno_core: "Abilitatea M2 și vraja de Pyromancer fac mai multe daune."
  deep_freeze: "Înghețurile tale de Frost Warden țin mai mult."
  brittle: "Inamicii încetiniți sau înghețați primesc mai multe daune de la bolturile tale."
  steed: "Calul care poartă armura e mai rapid."
  trample: "Calul în galop dă la o parte și rănește monștrii din cale. Comoară."
  loyal_guard: "Lupul tău din apropiere preia o parte din daunele pe care le primești."
  shearers_bounty: "Șansă de lână în plus când tunzi oi."
  delver: "Mai multe descoperiri de Digging (Professions)."
  bountiful: "Mai multe descoperiri de Farming (Professions)."
  lure_of_the_deep: "Mai mult XP de Fishing (Professions)."
  bloodhound: "Mai mult XP de Hunting (Professions)."
  crescendo: "Lovitura finală a combo-ului (x10) lovește și inamicii din jur."
  anchor: "Creaturile lovite nu se mai pot teleporta 3 secunde (Blinker)."
  purifier: "Creaturile lovite nu se mai vindecă 4 secunde (Regenerating, Vampire)."
  afterimage: "Prima lovitură în 2 secunde după o eschivă face mai multe daune."
  antidote: "Otrava și Wither-ul țin mai puțin."
  crimson_ward: "Mai puține daune în nopțile cu Lună Sângerie. Comoară."
  resonance: "Augment-urile abilităților de armă sunt mai puternice. Comoară."
