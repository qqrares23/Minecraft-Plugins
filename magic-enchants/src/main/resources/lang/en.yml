    name: "Swords, axes and spears"
    lore:
      - "<gray>Hits, bleeding, lightning, lifesteal..."
  spear:
    name: "Spears"
    lore:
      - "<gray>Only for spears."
  armor:
    name: "Armor and elytra"
    lore:
      - "<gray>Protection, mobility and flight."
  ranged:
    name: "Bows and crossbows"
    lore:
      - "<gray>Arrows that home, explode, bounce..."
  trident:
    name: "Tridents"
    lore:
      - "<gray>Whirlpools, storms and water."
  mace:
    name: "Maces"
    lore:
      - "<gray>Stronger smash attacks."
  shield:
    name: "Shields"
    lore:
      - "<gray>Rewards for blocking."
  tools:
    name: "Tools"
    lore:
      - "<gray>Pickaxes, shovels, hoes and fishing rods."
  magic:
    name: "Magic"
    lore:
      - "<gray>Work with skills, paths, professions,"
      - "<gray>combos and the Blood Moon."
  staff:
    name: "Staffs"
    lore:
      - "<gray>For Pyromancer and Frost Warden staffs"
      - "<gray>(Blaze Rod, Breeze Rod) - from books on an anvil."
  mounts:
    name: "Mounts and pets"
    lore:
      - "<gray>Horse armor and wolf armor."
