# What each enchantment does (shown in /enchants).
enchant:
  bleeding: "Chance to make the target bleed, ignoring armor."
  venom: "Chance to poison the target."
  frostbite: "Chance to slow and freeze the target."
  lifesteal: "Heals you for part of the damage you deal."
  executioner: "Extra damage against targets below 30% health."
  thunderstrike: "Chance to strike the target with lightning."
  cleaving: "Your hits also hurt enemies next to the target."
  soul_harvest: "Kills give more XP and sometimes a Soul Fragment (gives skill XP)."
  chain_lightning: "Chance for lightning to jump between nearby enemies."
  momentum: "Quick hits in a row deal more and more damage."
  skill_surge: "Every hit shortens your weapon skill cooldowns."
  pinning: "Charged hits can pin the target in place for 1.5 seconds."
  skyfall: "Hits while falling: +35% damage and the target is slammed down."
  vanguard: "With a shield in your off hand: stronger hits and less damage taken."
  thorns_of_frost: "Chance to slow and freeze whoever hits you."
  second_wind: "Below 20% health: a burst of Regeneration and Absorption (2 min cooldown)."
  evasion: "Small chance to dodge an attack completely."
  spring_heels: "Higher jumps and less fall damage."
  night_vision: "See in the dark while you wear it."
  homing: "Arrows curve towards nearby targets."
  barrage: "Shoot extra arrows with every shot (bows only)."
  explosive_tips: "Arrows explode on impact (never break blocks)."
  hunters_mark: "Targets you hit glow and take extra damage for a while."
  ricochet: "Arrows bounce to another nearby enemy after a hit."
  harpoon: "Arrows pull what they hit towards you."
  scatter_shot: "Arrows burst into shrapnel on impact, hurting everything around."
  auto_smelt: "Mined blocks drop already smelted: ingots instead of raw ore, stone, glass..."
  magnet: "What you mine goes straight into your inventory."
  excavator: "Mine 3x3 at once with pickaxes and shovels (sneak to mine a single block)."
  treasure_hunter: "Chance for a catch to be treasure: enchanted books, saddles, enchanted bows and rods..."
  snagging: "Reeling in yanks the hooked creature hard towards you."
  replenish: "Ripe crops harvested with the hoe replant themselves (using one seed from the harvest)."
  green_thumb: "While you hold the hoe, crops around you grow faster."
  tailwind: "A burst of speed when you start gliding (5 s cooldown)."
  cushion: "Less damage when you crash into a wall while flying."
  maelstrom: "A thrown trident leaves a whirlpool that pulls enemies in."
  stormcaller: "In the rain, a thrown trident calls lightning on the target (no thunderstorm needed)."
  undertow: "Extra damage against wet targets: in water or in the rain."
  aftershock: "Smash attacks leave a second shockwave a second later."
  gravity_well: "Smash attacks pull nearby enemies to the impact."
  featherfall: "With the mace in hand: half fall damage, none if you hit (or missed) just before landing."
  bastion: "A blocked attack gives you Absorption for a few seconds (10 s cooldown)."
  spiked: "Whoever hits your shield gets hurt on its spikes."
  reflection: "Chance for a blocked arrow to fly back at whoever shot it."
  arcane_echo: "Chance for a weapon skill (WeaponSkills) not to go on cooldown."
  cooldown_siphon: "Every kill shortens your weapon skill cooldowns."
  pathbound: "More XP for the path that uses this weapon."
  scholar: "More XP for the profession you use the tool for."
  mightslayer: "Extra damage against mighty mobs and special spawns."
  blood_moons_gift: "On Blood Moon nights: extra damage, and kills heal you."
  combo_keeper: "Your combo lasts longer between hits."
  soulbound: "The item stays with you when you die. Treasure: only from loot and librarians."
  packleader: "The wolf wearing this armor hits harder and heals when it kills."
  timbersong: "Woodcutting skills recharge faster and logs give more Woodcutting XP."
  prospector: "More Mining finds from ores (Professions)."
  bounty_hunter: "Mighty mobs and special spawns killed with this weapon are more likely to drop rare loot."
  warding: "Less damage from skills, path abilities and enchantment effects."
  steadfast: "Less knockback, and roots and pins wear off faster."
  last_stand: "Once every 3 minutes, a killing blow leaves you at one heart instead. Treasure."
  fleetfoot: "Your dodge roll recharges faster."
  sure_footed: "Soul sand and honey blocks no longer slow you down."
  clarity: "Blindness, Darkness and Nausea wear off faster."
  headhunters_eye: "Shows the health of the player or mob you look at in your sidebar."
  vigor: "+1 max heart per level."
  piercing_bolt: "Crossbow bolts punch through armor: more damage the more armor the target wears."
  overcharge: "A bolt kept loaded for at least 3 seconds deals more damage."
  impalers_reach: "Longer reach with the spear."
  rally: "Charged hits give Speed to the players around you (8 s cooldown)."
  shockwave: "Smash attacks disable the shields of enemies near the impact for 3 seconds."
  spellweaver: "Staff bolts fire more often (+10% per level)."
  battle_focus: "Your path's M2 skill and spell recharge faster (-8% per level)."
  wildfire: "A burning creature killed by your bolts bursts into flames that ignite enemies around it."
  inferno_core: "Pyromancer M2 skills and spells deal more damage (+10% per level)."
  deep_freeze: "Your Frost Warden freezes last longer (+20% per level)."
  brittle: "Slowed or frozen enemies take more damage from your bolts (+6% per level)."
  steed: "The horse wearing this armor is faster (+10% per level)."
  trample: "A galloping horse knocks aside and hurts monsters in its path. Treasure."
  loyal_guard: "Your wolf nearby takes part of the damage you take (15% per level)."
  shearers_bounty: "Chance of extra wool when shearing sheep."
  delver: "More Digging finds (Professions)."
  bountiful: "More Farming finds (Professions)."
  lure_of_the_deep: "More Fishing XP (Professions)."
  bloodhound: "More Hunting XP (Professions)."
  crescendo: "The combo finisher (x10) also hits enemies around the target."
  anchor: "Creatures you hit can't teleport for 3 seconds (Blinker)."
  purifier: "Creatures you hit can't heal for 4 seconds (Regenerating, Vampire)."
  afterimage: "Your first hit within 2 seconds after a dodge roll deals more damage."
  antidote: "Poison and Wither wear off sooner."
  crimson_ward: "Less damage taken on Blood Moon nights. Treasure."
  resonance: "Weapon skill augments are stronger. Treasure."
