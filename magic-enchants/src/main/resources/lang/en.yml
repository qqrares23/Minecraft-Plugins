focus:
  title: "<dark_purple><bold>✧ What are you looking for?"
  about:
    name: "<gold>Enchanting table focus"
    lore:
      - "<gray>Choose what kind of enchantments the table rolls."
      - "<gray>Your choice stays until you change it:"
      - "<yellow>shift + right-click<gray> an enchanting table."
  button: "<gold><bold><focus>"
  pick: "<yellow>Click: choose and open the table"
  selected: "<green>✔ Current choice <dark_gray>(click: open the table)"
  actionbar: "<light_purple>Focus: <white><focus> <dark_gray>(shift + right-click the table to change)"
  none: "<red>Nothing from <white><focus><red> goes on this item. <gray>Shift + right-click the table to change."
  all:
    name: "Everything"
    lore:
      - "<gray>The normal table: any enchantment,"
      - "<gray>vanilla or magic."
  vanilla:
    name: "Vanilla only"
    lore:
      - "<gray>Only the normal ones: Sharpness,"
      - "<gray>Protection, Efficiency, Unbreaking..."
  magic:
    name: "Magic only"
    lore:
      - "<gray>Only the magic enchantments (/enchants)."
